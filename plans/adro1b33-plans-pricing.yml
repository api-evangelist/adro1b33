price_transparency:
  prices_published: false
  detail: >-
    The pricing page renders a full plan comparison — credits, storage, compute type, memory, solver
    access, processing time and a per-plan "discount rate" — but every monetary Price cell is empty in
    the server-rendered HTML and is filled client-side after currency selection. The machine-readable
    catalog behind it, GET https://api.aoxlabs.com/plans/, was returning HTTP 500 at probe time even
    though the contract marks it public, and GET /credits/bundles/ returned 500 as well. So the tier
    structure is public and the numbers are not: a buyer or an agent cannot read a price from either
    the page or the API. Recorded as a finding, not guessed.
  evidence:
  - url: https://aoxlabs.com/pricing
    status: 200
  - url: https://api.aoxlabs.com/plans/
    status: 500
  - url: https://api.aoxlabs.com/credits/bundles/
    status: 500
