add_ons:
- name: Credit bundles
  detail: >-
    Bundles add credits to the current subscription but do NOT change which solvers the plan may use.
    Catalog at GET /credits/bundles/ and purchase at POST /credits/bundles/{bundle_id}/purchase/.
- name: Additional storage
  detail: >-
    Up to 500 GB beyond the plan allowance, on any plan. Retained for as long as the plan stays active.
    Quoted at GET /subscriptions/storage-addon/quote/ and bought at POST
    /subscriptions/storage-addon/purchase/.
metering:
  unit: credit
  detail: >-
    Consumption is metered in credits against a per-team wallet (GET /credits/wallet/, GET
    /credits/buckets/). GET /credits/estimate/ prices a job before submission and GET
    /credits/usage/jobs/ reports what each job actually cost.
plan_change_rules:
  upgrade: POST /plans/{code}/upgrade/ with a prior quote at GET /plans/{code}/upgrade-quote/
  downgrade: >-
    POST /plans/{code}/downgrade/ — reserved, applied at the end of the current cycle; no refund of the
    current-cycle price difference (https://aoxlabs.com/refund section 3).
  cancellation: >-
    POST /subscriptions/cancel/ — reserved, effective at cycle end; reversible with POST
    /subscriptions/resume/. Current-cycle fees are generally non-refundable
    (https://aoxlabs.com/refund section 2).
payment_providers:
- PayLetter
- PayPal
payment_providers_note: >-
  PayLetter is named directly in the contract (POST /billing-keys/payletter/register-and-charge/);
  PayPal and card issuers are named in https://aoxlabs.com/refund section 8.
