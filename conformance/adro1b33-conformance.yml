domain_standards:
- id: ucp
  name: Universal Commerce Protocol
  version: '2026-08-25'
  conforms: true
  market: agentic commerce
  evidence: >-
    https://adro.com/.well-known/ucp declares ucp.version 2026-08-25, supported_versions 2026-04-08 and
    2026-01-23, a dev.ucp.shopping service over MCP transport, and eight capability classes —
    dev.ucp.shopping.checkout, .fulfillment, .discount, .cart, .order, .catalog.search, .catalog.lookup
    and dev.shopify.catalog — each pinned to a ucp.dev spec and schema URL. The payment_handlers block
    declares com.google.pay for merchant "ADRO US" at merchant_origin adro.com. This is a genuine
    domain-standard signature in the contract itself, not a marketing claim, and it means an agent that
    already speaks UCP can transact with ADRO's storefront with no bespoke connector.
  caveat: >-
    Conformance is delivered by Shopify's platform, which implements UCP for every store it hosts. It
    is real and callable on ADRO's domain; it is not ADRO-authored protocol work.
- id: cfd-domain
  name: Computational fluid dynamics interchange
  conforms: unknown
  market: engineering simulation
  evidence: >-
    Checked deliberately and found nothing to record. The AOX contract moves geometry as STL
    (/stl/convert/, /stl/repair/, /projects/{project_id}/register-stl/, /sample-stls/) and STEP
    (/job/{id}/export-step/), and ADRO's site names HELYX and CF-MESH+ as the meshing workflows, but
    the contract declares no CGNS, no OpenVDB, no STEP AP242 profile identifier, no ISO 10303 reference
    and no standards-body conformance class. This is reward-only: no penalty is implied, and no
    conformance is asserted where the market has no declared standard the contract could carry.
