generated: '2026-09-07'
method: derived
source: >-
  openapi/adro1b33-aox-openapi.yaml (declared responses) plus live anonymous probes of
  api.aoxlabs.com for the envelopes the contract omits. No published error reference exists on
  aoxlabs.com to search.
format: drf-detail
format_note: >-
  NOT RFC 9457. No operation returns application/problem+json, and neither `type` nor `title` nor
  `status` appears in any error body. The API uses the two stock Django REST Framework envelopes.
contract_gap: >-
  The spec declares error responses on exactly ONE of 231 operations — POST
  /projects/{project_id}/register-stl/ declares 400 and 404, both with an untyped
  `{type: object, additionalProperties: {}}` schema and an empty description. Every other operation
  documents only its success codes (191x 200, 26x 201, 11x 204, 5x 202). A consumer reading the
  contract has no way to know what a failure looks like, which is why the envelopes below were
  established by probing rather than derived.
envelopes:
- id: detail
  shape: '{"detail": "<message>"}'
  schema: '#/components/schemas/DetailResponse'
  used_for:
  - 401 authentication failure
  - 403 permission denied
  - 404 not found
  - 405 method not allowed
  - 429 throttled
  note: >-
    The stock DRF APIException envelope. DetailResponse IS defined in components.schemas but is wired
    to success responses (e.g. logout, cancel), never to an error status.
- id: field_errors
  shape: '{"<field>": ["<message>", ...], ...}'
  used_for:
  - 400 request-body validation failure
  note: The stock DRF ValidationError envelope, keyed by serializer field name.
- id: django_html
  shape: 'text/html — <title>Server Error (500)</title>'
  used_for:
  - 500 unhandled server error
  note: >-
    An API client parsing JSON will fail on this body. Observed live on GET /plans/ and
    GET /credits/bundles/, two operations the contract marks as public.
localization:
  language: ko
  note: >-
    Error messages are returned in Korean regardless of Accept-Language. No Accept-Language handling
    or English fallback was observed. This is a real integration hazard for a platform whose stated
    market is global automotive OEMs — an agent or an English-locale client cannot match on message
    text.
