domain_failure_fields:
  note: >-
    Failure detail for long-running work is carried in the resource, not the HTTP error. The Job schema
    exposes `errorSummary` and `errorDetail` alongside `status`/`stage`, and the Payment schema exposes
    `failureCode` and `failureMessage`. An agent polling GET /job/{id}/ or GET /job/{id}/monitor/ reads
    failure there; a 200 does not mean the job succeeded.
