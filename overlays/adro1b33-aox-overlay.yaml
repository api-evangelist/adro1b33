- target: $.components
  description: >-
    Describe the authentication that the contract omits entirely. Marked as observed, not declared —
    see authentication/adro1b33-authentication.yml for the evidence and the confidence level.
  update:
    securitySchemes:
      aoxSession:
        type: apiKey
        in: cookie
        name: sessionid
        description: >-
          OBSERVED, NOT PROVIDER-DECLARED. The published document declares no securitySchemes. An
          anonymous request to any protected operation returns HTTP 401 with the Django REST Framework
          body {"detail":"자격 인증 데이터가 제공되지 않았습니다."}. A session is established at POST
          /accounts/login/ (email + password) or POST /accounts/social-login/, renewed at POST
          /accounts/token/refresh/, and ended at POST /accounts/logout/. LoginResponse returns no token
          in the body, which is consistent with an httpOnly cookie session rather than a bearer token.
          The cookie name is the Django default and has NOT been confirmed on the wire. Do not treat
          this scheme as authoritative — treat it as a documented gap in ADRO's contract.
