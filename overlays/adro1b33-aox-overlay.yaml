- target: $.info
  description: Attribute the document and name the operator, which info carries neither of.
  update:
    x-provider: ADRO, Inc.
    x-provider-url: https://adro.com
    x-product: AOX — Aerodynamic Optimization eXperience
    x-product-url: https://aoxlabs.com
