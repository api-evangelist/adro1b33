components:
  schemas:
    CleaningRun:
      type: object
      properties:
        uid:
          type: string
        projectId:
          type: integer
        projectUid:
          type: string
        projectName:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
        sourceFiles:
          type: array
          items:
            type: object
            additionalProperties: {}
        attempt:
          type: integer
        batchJobId:
          type: string
        plan: {}
        questions: {}
        viewerUrl:
          type:
          - string
          - 'null'
          format: uri
        files:
          type: array
          items:
            type: object
            additionalProperties: {}
        deletion:
          type: object
          additionalProperties: {}
        jobUid:
          type:
          - string
          - 'null'
        jobName:
          type: string
        revision:
          type: string
        review: {}
        usage: {}
        error:
          type: string
      required:
      - attempt
      - batchJobId
      - createdAt
      - deletion
      - error
      - files
      - jobName
      - jobUid
      - plan
      - projectId
      - projectName
      - projectUid
      - questions
      - review
      - revision
      - sourceFiles
      - status
      - uid
      - usage
      - viewerUrl
    CleaningAnswers:
      type: object
      properties:
        answers: {}
        revision:
          type: string
          maxLength: 64
      required:
      - answers
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 2000
        locale:
          enum:
          - ko
          - en
          type: string
          description: '* `ko` - ko

            * `en` - en'
          x-spec-enum-id: 659d4ef1ad5b5558
          default: en
        revision:
          type: string
          maxLength: 64
        history:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
      required:
      - message
      - revision
    CleaningProjectCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        draft:
          type: boolean
          default: false
    ConversationMessage:
      type: object
      properties:
        role:
          enum:
          - user
          - assistant
          type: string
          description: '* `user` - user

            * `assistant` - assistant'
          x-spec-enum-id: da623bca3e193af6
        content:
          type: string
          maxLength: 4000
      required:
      - content
      - role
    PreparationProposalRequest:
      type: object
      properties:
        proposalId:
          type: string
          maxLength: 4096
        assumeDefaults:
          type: boolean
      required:
      - assumeDefaults
      - proposalId
    CleaningStart:
      type: object
      properties:
        assumeDefaults:
          type: boolean
          default: false
        interactive:
          type: boolean
          default: false
    PreparationChatRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 2000
        locale:
          enum:
          - ko
          - en
          type: string
          description: '* `ko` - ko

            * `en` - en'
          x-spec-enum-id: 659d4ef1ad5b5558
          default: en
        revision:
          type: string
          maxLength: 64
        history:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        assumeDefaults:
          type: boolean
      required:
      - assumeDefaults
      - message
      - revision
    CleaningProgress:
      type: object
      properties:
        available:
          type: boolean
        reason:
          enum:
          - not_supported
          - not_running
          - not_published
          - stale
          - invalid
          - null
          type:
          - string
          - 'null'
          description: '* `not_supported` - not_supported

            * `not_running` - not_running

            * `not_published` - not_published

            * `stale` - stale

            * `invalid` - invalid'
          x-spec-enum-id: efc0f57a2614d49c
        attempt:
          type: integer
        boot:
          type:
          - string
          - 'null'
        seq:
          type:
          - integer
          - 'null'
        stage:
          type:
          - string
          - 'null'
        stageStartedAt:
          type:
          - number
          - 'null'
          format: double
        updatedAt:
          type:
          - number
          - 'null'
          format: double
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        viewer: {}
        sourceToWorking: {}
        scan: {}
        issuesRev:
          type:
          - integer
          - 'null'
        issues:
          type: array
          items:
            type: object
            additionalProperties: {}
        issueCounts:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - attempt
      - available
      - boot
      - issueCounts
      - issues
      - issuesRev
      - publishedAt
      - reason
      - scan
      - seq
      - sourceToWorking
      - stage
      - stageStartedAt
      - updatedAt
      - viewer
    PatchedCleaningProjectUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        confirm:
          type: boolean
          default: false
    CleaningReview:
      type: object
      properties:
        revision:
          type: string
          maxLength: 64
        attempt:
          type: integer
          minimum: 0
      required:
      - attempt
      - revision
  securitySchemes:
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
