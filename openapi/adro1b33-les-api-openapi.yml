          description: No response body
      summary: Les uploads init create
      x-summary-source: derived
components:
  schemas:
    LesAutoconfigUploadComplete:
      type: object
      properties:
        uploadId:
          type: string
          maxLength: 512
        completedParts:
          type: array
          items:
            $ref: '#/components/schemas/_CompletedPart'
        reservationId:
          type: string
          format: uuid
      required:
      - completedParts
      - reservationId
      - uploadId
    _CompletedPart:
      type: object
      properties:
        etag:
          type: string
          maxLength: 255
        partNumber:
          type: integer
          maximum: 10000
          minimum: 1
      required:
      - etag
      - partNumber
    LesAutoconfig:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        stlFilename:
          type: string
          readOnly: true
        intent:
          type: string
          readOnly: true
        status:
          enum:
          - pending
          - ready
          - failed
          type: string
          description: '* `pending` - Pending

            * `ready` - Ready

            * `failed` - Failed'
          x-spec-enum-id: 95a96ed85bfac560
          readOnly: true
        progress:
          readOnly: true
        geometry:
          readOnly: true
        config:
          readOnly: true
        error:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - config
      - createdAt
      - error
      - geometry
      - intent
      - progress
      - status
      - stlFilename
      - uid
    LesInputUploadComplete:
      type: object
      properties:
        uploadId:
          type: string
          maxLength: 512
        completedParts:
          type: array
          items:
            $ref: '#/components/schemas/_CompletedPart'
        reservationId:
          type: string
          format: uuid
      required:
      - completedParts
      - reservationId
      - uploadId
    LesInputUpload:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        stlFilename:
          type: string
          readOnly: true
        sizeBytes:
          type: integer
          readOnly: true
        status:
          enum:
          - pending
          - ready
          - failed
          type: string
          description: '* `pending` - Pending

            * `ready` - Ready

            * `failed` - Failed'
          x-spec-enum-id: 95a96ed85bfac560
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - sizeBytes
      - status
      - stlFilename
      - uid
