      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LesInputUploadComplete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LesInputUploadComplete'
          multipart/form-data:
