      - les
      responses:
        '200':
          description: No response body
      summary: Les runs figures retrieve
      x-summary-source: derived
  /les/runs/{uid}/files/{kind}/:
    get:
      operationId: les_runs_files_retrieve
      parameters:
      - in: path
        name: kind
        schema:
          type: string
