      responses:
        '200':
          description: No response body
      summary: Les runs viewer retrieve
      x-summary-source: derived
  /les/uploads/{uid}/abort/:
    post:
      operationId: les_uploads_abort_create
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - les
      responses:
        '200':
          description: No response body
      summary: Les uploads abort create
      x-summary-source: derived
  /les/uploads/{uid}/complete/:
    post:
      operationId: les_uploads_complete_create
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
