          type: string
        required: true
      tags:
      - les
      responses:
        '200':
          description: No response body
      summary: Les runs files retrieve
      x-summary-source: derived
  /les/runs/{uid}/flow-visualization/:
    get:
      operationId: les_runs_flow_visualization_retrieve
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - les
      responses:
        '200':
          description: No response body
      summary: Les runs flow visualization retrieve
      x-summary-source: derived
    post:
      operationId: les_runs_flow_visualization_create
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
