      summary: Les runs deletion preview retrieve
      x-summary-source: derived
  /les/runs/{uid}/figures/{name}/:
    get:
      operationId: les_runs_figures_retrieve
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
