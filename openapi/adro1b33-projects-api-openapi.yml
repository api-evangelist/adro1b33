openapi: 3.2.0
info:
  title: aox-django-backend Projects API
  version: 1.0.0
tags:
- name: Projects
paths:
  /projects/:
    get:
      operationId: projects_list
      description: 프로젝트 목록을 조회합니다. mode(G1/G2), include_archived 필터를 지원합니다.
      summary: 프로젝트 목록 조회
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Cursor for pagination
      - in: query
        name: include_archived
        schema:
          type: boolean
        description: '아카이브된 프로젝트 포함 여부 (default: false)'
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - G1
          - G2
          - G3
          - G4
          - S2
        description: Project mode filter (G1 또는 G2)
      - name: page_size
        required: false
        in: query
        description: 페이지당 반환할 결과 수.
        schema:
          type: integer
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectListList'
          description: ''
    post:
      operationId: projects_create
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreate'
          description: ''
      summary: Projects create
      x-summary-source: derived
  /projects/{id}/:
    get:
      operationId: projects_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
      summary: Projects retrieve
      x-summary-source: derived
    put:
      operationId: projects_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
      summary: Projects update
      x-summary-source: derived
    delete:
      operationId: projects_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '204':
          description: No response body
      summary: Projects destroy
      x-summary-source: derived
  /projects/{id}/activate/:
    post:
      operationId: projects_activate_create
      description: Uploads create projects as draft. This endpoint stores source files and promotes the project to active.
      summary: Activate draft project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /projects/{id}/artifacts/{artifact_id}/:
    delete:
      operationId: projects_artifacts_destroy
      parameters:
      - in: path
        name: artifact_id
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '204':
          description: No response body
      summary: Projects artifacts destroy
      x-summary-source: derived
  /projects/{id}/deletion-preview/:
    get:
      operationId: projects_deletion_preview_retrieve
      summary: 프로젝트 삭제 영향 미리보기
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /projects/{id}/geometry-rotation/:
    post:
      operationId: projects_geometry_rotation_create
      description: 저장된 unified_config.geometry.transform을 전체 source-patch group에 한 번 적용해 proxy mesh 기반 patch bbox, union bbox, viewer translate를 반환합니다.
      summary: 저장된 group transform의 proxy mesh geometry 계산
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeometryRotationResponse'
          description: ''
  /projects/{id}/jobs/:
    get:
      operationId: projects_jobs_list
      description: 특정 프로젝트의 Job 목록을 조회합니다. Pagination과 filtering을 지원합니다.
      summary: 프로젝트의 Job 목록 조회
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Cursor for pagination
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      - in: query
        name: mode
        schema:
          type: string
          x-spec-enum-id: b6373ee318bc60a4
          enum:
          - G1
          - G2
          - G3
          - G4
          - S2
        description: '* `G1` - G1

          * `G2` - G2

          * `G3` - G3

          * `G4` - G4

          * `S2` - Sketch 2D'
      - name: page_size
        required: false
        in: query
        description: 페이지당 반환할 결과 수.
        schema:
          type: integer
      - in: query
        name: project_mode
        schema:
          type: string
          enum:
          - G1
          - G2
          - G3
          - G4
          - S2
        description: Project mode filter
      - in: query
        name: status
        schema:
          type: string
          enum:
          - aborted
          - cancellation_failed
          - cancelled
          - cancelling
          - failed
          - queued
          - running
          - succeeded
        description: Job status filter
      - in: query
        name: view
        schema:
          type: string
          enum:
          - sidebar
        description: Compact response shape for the RUNS sidebar
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListList'
          description: ''
  /projects/{id}/mesh-predict/:
    get:
      operationId: projects_mesh_predict_retrieve
      description: Source Patch metadata와 solver mesh settings를 사용해 최종 mesh cell 수를 예측합니다.
      summary: 프로젝트 mesh cell 예측
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshPredictResponse'
          description: ''
  /projects/{id}/patches/ref/:
    post:
      operationId: projects_patches_ref_create
      description: 'Creates a ref patch for a source patch. The server assigns its immutable-at-creation label as `Patch #N` from the project''s monotonic ref-patch label sequence. `label` is not part of the request schema and is ignored for older clients.'
      summary: Create ref patch
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patch'
          description: ''
  /projects/{id}/purge-now/:
    post:
      operationId: projects_purge_now_create
      summary: 프로젝트 즉시 영구 삭제 접수
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
