      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /projects/{id}/restore/:
    post:
      operationId: projects_restore_create
      summary: 삭제 예정 프로젝트 복구
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /projects/{id}/thumbnail/:
    post:
      operationId: projects_thumbnail_create
      description: Registers an uploaded WebP thumbnail S3 object as a PROJECT_THUMBNAIL_IMAGE artifact.
      summary: Register project thumbnail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectThumbnailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectThumbnailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectThumbnailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectThumbnail'
          description: ''
  /projects/{id}/workbench-runtime/:
    get:
      operationId: projects_workbench_runtime_retrieve
      description: Patch DB 상태에서 계산한 geometry, scene unit scale, processing state를 반환합니다.
      summary: 프로젝트 워크벤치 runtime 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchRuntime'
          description: ''
  /projects/{id}/workbench-state/:
    get:
      operationId: projects_workbench_state_retrieve
      description: GET은 저장된 unified config와 revision을 반환합니다. PUT은 expected_revision이 현재 revision과 일치할 때만 unified_config를 덮어씁니다.
      summary: 프로젝트 워크벤치 state 조회/저장
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchState'
          description: ''
    put:
      operationId: projects_workbench_state_update
      description: GET은 저장된 unified config와 revision을 반환합니다. PUT은 expected_revision이 현재 revision과 일치할 때만 unified_config를 덮어씁니다.
      summary: 프로젝트 워크벤치 state 조회/저장
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 프로젝트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchStateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkbenchStateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkbenchStateUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchState'
          description: ''
  /projects/{project_id}/register-stl/:
    post:
      operationId: projects_register_stl_create
      description: S3에 이미 업로드된 STL 파일을 Artifact로 등록합니다.
      summary: STL Artifact 등록
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/STLArtifactRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/STLArtifactRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/STLArtifactRegister'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /projects/{project_id}/source-uploads/abort/:
    post:
      operationId: projects_source_uploads_abort_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - Projects
      requestBody:
