          application/json:
            schema:
              $ref: '#/components/schemas/SourceUploadComplete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceUploadComplete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceUploadComplete'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
      summary: Projects source uploads complete create
      x-summary-source: derived
  /projects/{project_id}/source-uploads/init/:
    post:
      operationId: projects_source_uploads_init_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUploadInit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceUploadInit'
          multipart/form-data:
            schema:
