          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCounts'
          description: ''
components:
  schemas:
    SourceUploadComplete:
      type: object
      properties:
        uploadTrackerId:
          type: integer
          minimum: 1
        fileName:
          type: string
        contentType:
          type:
          - string
          - 'null'
        objectKey:
          type: string
        uploadId:
          type: string
        reservationId:
          type: string
          format: uuid
        proxyWorkerRevision:
          type: string
        proxyArtifactSignature:
          type: string
