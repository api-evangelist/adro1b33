      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchStateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkbenchStateUpdate'
          multipart/form-data:
            schema:
