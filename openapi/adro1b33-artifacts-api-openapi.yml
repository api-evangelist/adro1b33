openapi: 3.2.0
info:
  title: aox-django-backend Artifacts API
  version: 1.0.0
tags:
- name: Artifacts
paths:
  /artifacts/:
    get:
      operationId: artifacts_list
      parameters:
      - name: limit
        required: false
        in: query
        description: 페이지당 반환할 결과 수.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: 결과를 반환할 초기 인덱스.
        schema:
          type: integer
      tags:
      - Artifacts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtifactListList'
          description: ''
      summary: Artifacts list
      x-summary-source: derived
    post:
      operationId: artifacts_create
      tags:
      - Artifacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtifactCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtifactCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCreate'
          description: ''
      summary: Artifacts create
      x-summary-source: derived
  /artifacts/{artifact_id}/download/:
    get:
      operationId: artifacts_download_retrieve
      parameters:
      - in: path
        name: artifact_id
        schema:
          type: integer
        required: true
      tags:
      - Artifacts
      responses:
        '200':
          description: No response body
      summary: Artifacts download retrieve
      x-summary-source: derived
  /artifacts/{id}/:
    get:
      operationId: artifacts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 아티팩트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Artifacts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
      summary: Artifacts retrieve
      x-summary-source: derived
    put:
      operationId: artifacts_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 아티팩트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Artifacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Artifact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Artifact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Artifact'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
      summary: Artifacts update
      x-summary-source: derived
    patch:
      operationId: artifacts_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 아티팩트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Artifacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtifact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtifact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtifact'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
      summary: Artifacts partial update
      x-summary-source: derived
    delete:
      operationId: artifacts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 아티팩트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Artifacts
      responses:
        '204':
          description: No response body
      summary: Artifacts destroy
      x-summary-source: derived
  /artifacts/{id}/copy/:
    post:
      operationId: artifacts_copy_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 아티팩트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Artifacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Artifact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Artifact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Artifact'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
      summary: Artifacts copy create
      x-summary-source: derived
  /artifacts/{id}/download_url/:
    get:
      operationId: artifacts_download_url_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 아티팩트을 식별하는 고유한 정수 값.
        required: true
      tags:
      - Artifacts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
      summary: Artifacts download url retrieve
      x-summary-source: derived
