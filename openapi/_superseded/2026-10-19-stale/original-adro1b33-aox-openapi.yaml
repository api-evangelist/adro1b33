    BillingKeySwapRequest:
      type: object
      description: |-
        결제수단 변경(swap) 요청.

        프론트 흐름:
          - PayLetter : `/payments/prepare/?provider=payletter` 로 소액 paymentId 채번 →
            `requestIssueBillingKeyAndPay` 로 발급+소액결제 → 콜백 billingKey + paymentId 전달.
          - PayPal/Galaxia : `requestIssueBillingKey` 로 단독발급 → 콜백 billingKey 전달
            (payment_id 불필요).
      properties:
        teamId:
          type: integer
        provider:
          enum:
          - payletter
          - paypal
          - galaxia
          type: string
          description: |-
            * `payletter` - PayLetter
            * `paypal` - PayPal
            * `galaxia` - Galaxia
          x-spec-enum-id: 57f6d0e06595d82e
          default: paypal
        billingKey:
          type: string
          maxLength: 128
        paymentId:
          type: string
          maxLength: 64
        channelKey:
          type: string
          maxLength: 128
        reason:
          type: string
          maxLength: 200
        billingCountry:
          type: string
          maxLength: 2
        legalName:
          type: string
          maxLength: 255
        billingEmail:
          type: string
          format: email
      required:
      - billingCountry
      - billingEmail
      - billingKey
      - legalName
      - teamId
    BillingMethodSwap:
      type: object
      description: |-
        결제수단 변경(swap) 결과. 새 빌링키 + 후속(환불/폐기) 결과 플래그.

        refund_failed / old_delete_failed 가 true 면 발급은 성공했으나 후속이 일부 실패한
        것 (status=COMPLETED_WITH_WARNINGS) — note 에 사유. CS/재시도 대상 식별용.
      properties:
        id:
          type: integer
          readOnly: true
        teamId:
          type: integer
          readOnly: true
        provider:
          enum:
          - payletter
          - paypal
          - galaxia
          type: string
          description: |-
            * `payletter` - PayLetter
            * `paypal` - PayPal
            * `galaxia` - Galaxia
          x-spec-enum-id: 57f6d0e06595d82e
        newBillingKey:
          allOf:
          - $ref: '#/components/schemas/BillingKey'
          readOnly: true
        oldBillingKey:
          type: string
          readOnly: true
          nullable: true
        microPaymentId:
          type: string
          readOnly: true
          nullable: true
        createdByUserId:
          type: integer
          readOnly: true
          nullable: true
        reason:
          type: string
          maxLength: 200
        status:
          enum:
          - COMPLETED
          - COMPLETED_WITH_WARNINGS
          type: string
          description: |-
            * `COMPLETED` - 완료 (발급+환불+기존폐기 모두 성공)
            * `COMPLETED_WITH_WARNINGS` - 발급 성공 + 후속(환불/폐기) 일부 실패
          x-spec-enum-id: 9713d5910cb6bc4a
        refundFailed:
          type: boolean
        oldDeleteFailed:
          type: boolean
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - createdByUserId
      - id
      - microPaymentId
      - newBillingKey
      - oldBillingKey
      - provider
      - teamId
