components:
  schemas:
    AccountTeam:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
        name:
          type: string
        slug:
          type: string
        role:
          type: string
          nullable: true
        displayNameOverride:
          type: string
          nullable: true
        tenantId:
          type: integer
          nullable: true
        tenantSchemaName:
          type: string
        capabilities:
          $ref: '#/components/schemas/TeamCapabilities'
      required:
      - id
      - name
    AiAssistRequest:
      type: object
      properties:
        locale:
          enum:
          - ko
          - en
          type: string
          description: |-
            * `ko` - ko
            * `en` - en
          x-spec-enum-id: 659d4ef1ad5b5558
          default: ko
    AiChatHistoryItem:
      type: object
      properties:
        role:
          enum:
          - user
          - assistant
          type: string
          description: |-
            * `user` - user
            * `assistant` - assistant
          x-spec-enum-id: da623bca3e193af6
        content:
          type: string
          maxLength: 3000
      required:
      - content
      - role
    AiChatRequest:
      type: object
      properties:
        locale:
          enum:
          - ko
          - en
          type: string
          description: |-
            * `ko` - ko
            * `en` - en
          x-spec-enum-id: 659d4ef1ad5b5558
          default: ko
        intent:
          enum:
          - setup_guide
          - parameter_help
          - recommendation
          - diagnosis
          - usage
          - support
          type: string
          description: |-
            * `setup_guide` - setup_guide
            * `parameter_help` - parameter_help
            * `recommendation` - recommendation
            * `diagnosis` - diagnosis
            * `usage` - usage
            * `support` - support
          x-spec-enum-id: 2d57c9fc7f22c92f
        message:
          type: string
          default: ''
          maxLength: 2000
        jobUid:
          type: string
          default: ''
          maxLength: 36
        parameterPath:
          type: string
          default: ''
          maxLength: 160
        history:
          type: array
          items:
            $ref: '#/components/schemas/AiChatHistoryItem'
      required:
      - intent
    AiChatResponse:
      type: object
      properties:
        intent:
          type: string
        engine:
          type: string
