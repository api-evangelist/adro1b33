      operationId: billing_keys_bypass_hint_retrieve
      summary: 빌링키 발급 SDK 호출에 필요한 PG 별 bypass 페이로드 + channel_key. PG 별 추가 파라미터가 필요한
        경우 프론트가 SDK 호출 전에 가져간다.
      parameters:
      - in: query
        name: provider
        schema:
          type: string
          enum:
          - galaxia
          - payletter
          - paypal
        description: '결제 PG provider. 예: paypal, payletter, galaxia'
        required: true
