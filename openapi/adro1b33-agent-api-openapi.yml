components:
  schemas:
    AgentMessageContentBlock:
      oneOf:
      - $ref: '#/components/schemas/TextContentBlock'
      - $ref: '#/components/schemas/RedactedContentBlock'
      - $ref: '#/components/schemas/AttachmentContentBlock'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextContentBlock'
          content_redacted: '#/components/schemas/RedactedContentBlock'
          attachment: '#/components/schemas/AttachmentContentBlock'
    AgentTurnCreateRequest:
      type: object
      properties:
        clientRequestUid:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        message:
          $ref: '#/components/schemas/AgentTurnMessageRequest'
        clientContext:
          type: object
          properties:
            timeZoneHint:
              type: string
              minLength: 1
              maxLength: 64
          required: []
          additionalProperties: false
        surface:
          $ref: '#/components/schemas/AgentTurnSurfaceRequest'
      required:
      - clientRequestUid
      - message
      additionalProperties: false
    AgentAttachmentCompleteRequest:
      type: object
      properties:
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - sizeBytes
      - sha256
      additionalProperties: false
    AgentMessageProjection:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
          - 1
        messageUid:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        turnUid:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        role:
          type: string
          minLength: 1
          maxLength: 128
          enum:
          - user
          - assistant
        contentBlocks:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessageContentBlock'
          minItems: 1
          maxItems: 256
        completedSequence:
          type: integer
          minimum: 1
        createdAt:
          type: string
          minLength: 1
          maxLength: 64
          format: date-time
      required:
      - schemaVersion
      - messageUid
      - turnUid
      - role
      - contentBlocks
      - completedSequence
      - createdAt
      additionalProperties: false
    AgentMessageHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessageProjection'
          minItems: 0
        nextBefore:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 4096
      required:
      - items
      - nextBefore
      additionalProperties: false
    AgentMemoryFact:
      type: object
      properties:
        toolName:
          type: string
          minLength: 1
          maxLength: 128
          enum:
          - aox_activity_recent_projects
          - aox_asset_get
          - aox_asset_registration_candidates
          - aox_asset_search
          - aox_comment_list
          - aox_comment_thread_list
          - aox_geometry_list
          - aox_geometry_version_get
          - aox_geometry_version_list
          - aox_job_get
          - aox_job_list
          - aox_job_result_summary
          - aox_paper_plane_get_guide
          - aox_paper_plane_get_ranking
          - aox_project_get
          - aox_project_get_summary
          - aox_project_search
        projectUids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 36
          maxItems: 50
        resourceUids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 36
          maxItems: 50
        returnedCount:
          type: integer
          minimum: 0
          maximum: 50
        hasMore:
          type: boolean
        projectStatus:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          enum:
          - open
          - closed
      required:
      - toolName
      - projectUids
      - resourceUids
      - returnedCount
      - hasMore
      - projectStatus
      additionalProperties: false
    AgentThreadNavigationProjectNode:
      type: object
      properties:
        projectUid:
          type: string
          minLength: 1
          maxLength: 36
        title:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 255
        status:
          type: string
          minLength: 1
          maxLength: 128
          enum:
          - open
          - closed
        activityState:
          type: string
          minLength: 1
          maxLength: 128
          enum:
          - idle
          - queued
          - running
          - waiting_for_client
          - waiting_for_approval
        needsApproval:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentThreadProjection'
          minItems: 0
          maxItems: 20
        nextCursor:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 8192
      required:
      - projectUid
      - title
      - status
      - activityState
      - needsApproval
      - items
      - nextCursor
      additionalProperties: false
    AgentTurnMessageRequest:
      type: object
      properties:
        text:
