          - ONE_TIME
          - BILLING
          type: string
          description: '* `ONE_TIME` - 단건결제

            * `BILLING` - 빌링키결제'
          x-spec-enum-id: 1bec82349f1a053f
        provider:
          enum:
          - payletter
          - paypal
          - galaxia
