components:
  schemas:
    RaceSessionCreate:
      type: object
      properties:
        geometryTransport:
          enum:
          - bundled-glb
          - proxy-parts-v1
          type: string
          description: '* `bundled-glb` - bundled-glb

            * `proxy-parts-v1` - proxy-parts-v1'
          x-spec-enum-id: a79c18e17a6f5829
          default: bundled-glb
        jobUid:
          type: string
          maxLength: 36
        gameBuildId:
          type: string
          maxLength: 64
        vehiclePresetId:
          enum:
          - gt-validation-v1
          - formula-student-validation-v1
          type: string
          description: '* `gt-validation-v1` - gt-validation-v1

            * `formula-student-validation-v1` - formula-student-validation-v1'
          x-spec-enum-id: c9fb85c158588aaa
          default: gt-validation-v1
      required:
      - gameBuildId
      - jobUid
    RaceJobListResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/RaceJobResponse'
      required:
      - count
      - results
    RaceJobResponse:
      type: object
      properties:
        displayName:
          type:
          - string
          - 'null'
        uid:
          type: string
        projectUid:
          type: string
        projectName:
          type:
          - string
          - 'null'
        solver:
          type: string
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        availability:
          type: string
        reasonCode:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        primaryMetric:
          type: string
        aerodynamics:
          type: object
          additionalProperties: {}
      required:
      - availability
      - finishedAt
      - projectName
      - projectUid
      - solver
      - uid
    RaceFeedback:
      type: object
      properties:
        differenceFelt:
          type: integer
          maximum: 5
          minimum: 1
        wouldOptimizeAgain:
          type: boolean
        comment:
          type: string
          default: ''
          maxLength: 2000
      required:
      - differenceFelt
      - wouldOptimizeAgain
    RaceSessionResponse:
      type: object
      properties:
        uid:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
        readOnly:
          type: boolean
        performanceSnapshot:
          type: object
          additionalProperties: {}
        bestLaps:
          type: object
          additionalProperties: {}
        error:
          type:
          - object
          - 'null'
          additionalProperties: {}
      required:
      - bestLaps
      - error
      - expiresAt
      - performanceSnapshot
      - readOnly
      - status
      - uid
    RaceLapCreate:
      type: object
      properties:
        clientLapUid:
          type: string
          maxLength: 64
        variant:
          enum:
          - baseline
          - optimized
          type: string
          description: '* `baseline` - baseline

            * `optimized` - optimized'
          x-spec-enum-id: 25d9810d1ad94602
        isValid:
          type: boolean
        lapTimeMs:
          type:
          - integer
          - 'null'
          minimum: 1
        sectorTimesMs:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 3
        maxSpeedKph:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
        cornerSpeedsKph:
          type: object
          additionalProperties:
            type: number
            format: double
            minimum: 0
        referenceResult:
          type: object
          additionalProperties: {}
        invalidReasons:
          type: array
          items:
            type: string
            maxLength: 64
      required:
      - clientLapUid
      - isValid
      - variant
  securitySchemes:
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: ADRO
  source: https://api.aoxlabs.com/schema/
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
