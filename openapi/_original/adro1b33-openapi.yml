      description: |-
        POST /job/{id}/delete/ — Job 소프트 삭제.

        - 실행 중(QUEUED / RUNNING)이면 먼저 취소(cancel) 후 소프트 삭제.
        - 삭제된 Job은 API 응답에서 제외됨 (is_deleted=True 필터링).
        - 어드민에서 is_deleted=False로 되돌려 복구 가능.
        - request body 불필요.
      summary: Job 삭제 (소프트)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 작업을 식별하는 고유한 정수 값.
        required: true
      tags:
      - jobs
      responses:
        '200':
