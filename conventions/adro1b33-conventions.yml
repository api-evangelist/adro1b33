  errors: errors/adro1b33-problem-types.yml
  lifecycle: lifecycle/adro1b33-lifecycle.yml
  authentication: authentication/adro1b33-authentication.yml
  rate_limits: rate-limits/adro1b33-rate-limits.yml
  data_model: data-model/adro1b33-data-model.yml
