provenance:
  authored_by: platform
  platform: Shopify
  note: This is Shopify's platform-provided Universal Commerce Protocol implementation, served on ADRO's
    own domain for ADRO's own catalog and checkout. The endpoint, the merchant profile, the payment handlers
