source: mcp/adro1b33-ucp-mcp-tools.json (probed) + openapi/adro1b33-aox-openapi.yaml (searched)
finding: ADRO runs two entirely separate API surfaces and they do not overlap. The MCP tools belong to the Shopify-hosted
  US parts storefront at adro.com (catalog, cart, checkout, order); the OpenAPI belongs to the AOX aerodynamic optimization
  platform at api.aoxlabs.com (projects, CFD jobs, geometry, credits, plans). Not one MCP tool binds to an AOX operation,
  and no AOX operation is exposed to agents. The crosswalk is emitted precisely to record that divergence rather
  than to imply a mapping.
