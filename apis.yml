aid: adro1b33
name: ADRO
description: ADRO, Inc. (에이드로) is a South Korean mobility aerotech company in Yongin-si, Gyeonggi-do that designs and manufactures aerospace-grade
  carbon-fiber aerodynamic components for global automotive brands, and that has extended into software with AOX (Aerodynamic Optimization eXperience)
  — a web-based, GPU- and HPC-backed aerodynamic design and optimization platform operated at aoxlabs.com that takes a CAD or STL geometry through
  meshing, CFD simulation, shape optimization and post-processing without requiring CFD expertise. The AOX platform is backed by a public Django
  REST Framework contract at api.aoxlabs.com serving a 231-operation OpenAPI 3.0.3 document covering projects, jobs, LES runs, sketch sessions,
  patches, artifacts, assets, teams, credits, plans, subscriptions and payments. The company's US direct-to-consumer parts storefront at adro.com
  is a Shopify store that serves an agent-facing llms.txt and a live Universal Commerce Protocol (UCP) MCP endpoint.
