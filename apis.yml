- name: ADRO US Store Agent Commerce (UCP / MCP)
  description: >-
    ADRO's US direct-to-consumer aero-parts storefront at adro.com is a Shopify store that publishes an agent-facing
    surface on ADRO's own domain — an llms.txt of agent instructions, a UCP merchant profile at /.well-known/ucp, and
    a live Universal Commerce Protocol MCP endpoint at POST /api/ucp/mcp whose anonymous tools/list returns thirteen
    tools with full JSON Schema inputs for catalog search and lookup, product retrieval, cart, checkout and order.
    The runtime is Shopify's platform-provided UCP implementation rather than ADRO-authored code; the endpoint,
    merchant profile and catalog are ADRO's.
  humanURL: https://adro.com/llms.txt
