apis:
- name: AOX Platform API
  description: >-
    The REST API behind AOX, ADRO's aerodynamic optimization platform. A Django REST Framework backend serving a
    public, machine-readable OpenAPI 3.0.3 document (drf-spectacular) with 231 operations across 207 paths:
    accounts and team management, projects, jobs, LES runs, sketch sessions, geometry patches, artifacts, an asset
    marketplace, STL conversion and repair, credits and credit bundles, plans, subscriptions and payments. Nineteen
    operations are explicitly unauthenticated (login, signup, social login, token refresh, plans, credit bundles,
    board announcements, health, tenant existence, email verification); the remainder require an authenticated
    session.
